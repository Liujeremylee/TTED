[package]
name = "cube-rs"
version = "0.1.0"
edition = "2021"
description = "TTED 5x5x5 LED cube firmware for the Raspberry Pi Pico 2 (RP2350): PIO + DMA refresh"
license = "GPL-3.0-or-later"

[dependencies]
cortex-m = "0.7.7"
cortex-m-rt = "0.7.5"
critical-section = "1.2.0"
embedded-hal = "1.0.0"
fugit = "0.3.7"          # must match rp235x-hal 0.4
heapless = "0.9.3"
panic-halt = "1.0.0"
pio = "0.3.0"            # must match rp235x-hal 0.4
rp235x-hal = { version = "0.4.0", features = ["rt", "critical-section-impl", "binary-info"] }
usb-device = "0.3.2"
usbd-serial = "0.2.2"

[features]
default = []
# Ignore the 595's rated clock and run as fast as the chip can: PIO divider 1 (PIO = CPU = 240 MHz),
# so the 595 shift clock is 120 MHz, ~6x the 20 MHz the board was designed for. Fast-slew, 12 mA pads.
# Build with:  cargo build --release --features unlimited   (or: bundle.ps1 -Unlimited -> dist-unlimited/)
# Jason, your retirement time has came closer.
unlimited = []

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = 2                # symbols only; nothing extra goes to flash
incremental = false

[profile.dev]
opt-level = "s"
